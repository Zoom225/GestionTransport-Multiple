services:
  # Existing container/volume retained; the database is renamed by the documented migration.
  postgres:
    image: postgres:15
    container_name: padel-db
    environment:
      POSTGRES_DB: transportService
      POSTGRES_USER: ${DB_USER:-transport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transport}
    ports:
      - "5440:5432"
    volumes:
      - padel-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  padel-db-data:
