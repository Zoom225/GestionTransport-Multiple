name: Validation GestionTransport

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: issue1_validation_ci
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U transport -d issue1_validation_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_BASELINE_URL: jdbc:postgresql://localhost:5432/issue1_validation_ci
      DB_USER: transport
      DB_PASSWORD: transport_ci_only
      DEMO_DATA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
