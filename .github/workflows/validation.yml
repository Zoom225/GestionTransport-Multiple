name: Validation GestionTransport

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: issue1_validation_ci
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U transport -d issue1_validation_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_BASELINE_URL: jdbc:postgresql://localhost:5432/issue1_validation_ci
      DB_USER: transport
      DB_PASSWORD: transport_ci_only
      DEMO_DATA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw -B verify
      - name: Vérifier migration et mappings sur copie PostgreSQL
        env:
          PGPASSWORD: transport_ci_only
          TRANSPORT_SCHEMA_URL: jdbc:postgresql://localhost:5432/transport_schema_copy_ci
        run: |
          createdb -h localhost -U transport transport_schema_copy_ci
          pg_dump -h localhost -U transport --no-owner issue1_validation_ci | psql -h localhost -U transport -v ON_ERROR_STOP=1 transport_schema_copy_ci
          psql -h localhost -U transport -d transport_schema_copy_ci -f src/test/resources/schema-historique-fixture.sql
          psql -h localhost -U transport -d transport_schema_copy_ci -At -f scripts/migrations/issue-3-empreintes.sql > /tmp/schema-before.txt
          psql -h localhost -U transport -d transport_schema_copy_ci -f scripts/migrations/issue-3-schema-transport.sql
          psql -h localhost -U transport -d transport_schema_copy_ci -At -f scripts/migrations/issue-3-empreintes.sql > /tmp/schema-after.txt
          cmp /tmp/schema-before.txt /tmp/schema-after.txt
          psql -h localhost -U transport -d transport_schema_copy_ci -f scripts/migrations/issue-3-schema-transport.sql
          psql -h localhost -U transport -d transport_schema_copy_ci -At -f scripts/migrations/issue-3-empreintes.sql > /tmp/schema-second.txt
          cmp /tmp/schema-after.txt /tmp/schema-second.txt
          psql -h localhost -U transport -d transport_schema_copy_ci -v ON_ERROR_STOP=1 -c 'CREATE TABLE sites(id bigint)'
          if psql -h localhost -U transport -d transport_schema_copy_ci -f scripts/migrations/issue-3-schema-transport.sql; then
            echo 'La migration aurait dû refuser les tables parallèles'; exit 1
          fi
          psql -h localhost -U transport -d transport_schema_copy_ci -v ON_ERROR_STOP=1 -c 'DROP TABLE sites'
          psql -h localhost -U transport -d transport_schema_copy_ci -At -f scripts/migrations/issue-3-empreintes.sql > /tmp/schema-refusal.txt
          cmp /tmp/schema-after.txt /tmp/schema-refusal.txt
          bash ./mvnw -B -Dtest=TransportSchemaValidationTest test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
