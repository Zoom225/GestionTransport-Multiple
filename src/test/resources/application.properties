# Default tests use isolated H2; opt-in PostgreSQL tests override this datasource.
spring.datasource.url=jdbc:h2:mem:baseline;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
app.demo-data.enabled=false
jwt.secret=test-only-baseline-signing-key-at-least-32-bytes-long
jwt.expiration=86400000
