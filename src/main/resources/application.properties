
# ===== Database (PostgreSQL Docker) =====
# Local development: transportService database, transport/transport credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/transportService}
spring.datasource.username=${DB_USER:transport}
spring.datasource.password=${DB_PASSWORD:transport}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# ===== Server =====
server.port=8080

# ===== JWT Configuration =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
transport.reservation.delai-paiement=${RESERVATION_PAYMENT_TTL:PT30M}

# ===== Swagger / OpenAPI Configuration =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# ===== H2 Console (désactivée) =====
spring.h2.console.enabled=false
