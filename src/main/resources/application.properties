
# ===== Database (PostgreSQL Docker) =====
# Legacy database/account names intentionally retained to protect existing data.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/padelService}
spring.datasource.username=${DB_USER:padel}
spring.datasource.password=${DB_PASSWORD:padel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# ===== Server =====
server.port=8080

# ===== JWT Configuration =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# ===== Swagger / OpenAPI Configuration =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# ===== H2 Console (désactivée) =====
spring.h2.console.enabled=false
